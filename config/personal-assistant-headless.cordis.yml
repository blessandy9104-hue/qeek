# mathcore MCP integration
- insert:
    - id: mathcore-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mathcore
        transport: stdio
        command: mathcore-mcp
        cwd: !!js process.cwd()
        env:
          MATHCORE_AUDIT: !!js >-
            process.env.MATHCORE_AUDIT?.trim() || 
            process.getBuiltinModule('node:path').join(
              process.getBuiltinModule('node:os').homedir(), 
              '.mathcore', 
              'audit.jsonl'
            )

# Knowledge vault filesystem access
- insert:
    - id: vault-fs
      name: '@deepseek-ai/dsh-fs-local'
      config:
        root: !!js >-
          process.env.ASSISTANT_VAULT_PATH || 
          process.getBuiltinModule('node:path').join(process.cwd(), 'knowledge-vault')

# Session persistence (real package: packages/session/session-persistence-jsonl)
- insert:
    - id: session-persistence
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        directory: !!js >-
          process.getBuiltinModule('node:path').join(
            process.getBuiltinModule('node:os').homedir(), 
            '.personal-assistant', 
            'sessions'
          )