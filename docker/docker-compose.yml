version: '3.8'

services:
  # Main qeek CLI application
  qeek-cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cli
    container_name: qeek-cli
    volumes:
      - ./data/vault:/app/data/vault
      - ./data/sessions:/app/data/sessions
      - ./data/audit:/app/data/audit
      - ../knowledge-vault:/app/knowledge-vault:ro
    environment:
      - NODE_ENV=development
      - ASSISTANT_VAULT_PATH=/app/data/vault
      - MATHCORE_AUDIT=/app/data/audit/audit.jsonl
    stdin_open: true
    tty: true
    profiles:
      - cli

  # Web UI application
  qeek-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: qeek-web
    ports:
      - "3080:3080"
    volumes:
      - ./data/vault:/app/data/vault
      - ./data/sessions:/app/data/sessions
      - ./data/audit:/app/data/audit
      - ../knowledge-vault:/app/knowledge-vault:ro
    environment:
      - NODE_ENV=development
      - PORT=3080
      - ASSISTANT_VAULT_PATH=/app/data/vault
      - MATHCORE_AUDIT=/app/data/audit/audit.jsonl
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - web

  # Ollama for local LLM inference
  ollama:
    image: ollama/ollama:latest
    container_name: qeek-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    profiles:
      - local-llm

  # PostgreSQL for session persistence (optional)
  postgres:
    image: postgres:16-alpine
    container_name: qeek-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=qeek
      - POSTGRES_USER=qeek
      - POSTGRES_PASSWORD=qeek
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qeek -d qeek"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: qeek-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - redis

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: qeek-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: qeek-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    profiles:
      - monitoring

volumes:
  ollama-data:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data: