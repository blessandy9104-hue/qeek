name-template: "v$NEXT_PATCH_VERSION — $CHANGES_SUBJECT"
tag-template: "v$NEXT_PATCH_VERSION"
change-template: "- $TITLE #$NUMBER (@$AUTHOR)"
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
      - "enhancement"
  - title: "🐛 Bug Fixes"
    labels:
      - "bug"
  - title: "🧰 Maintenance"
    labels:
      - "chore"
      - "deps"
  - title: "📚 Docs"
    labels:
      - "docs"

template: |
  ## What's changed
  $CHANGES

  ## Contributors
  Thanks to all contributors!
