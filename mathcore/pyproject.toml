[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mathcore"
version = "0.1.0"
description = "Local, keyless, verified mathematical execution subsystem: parse -> authorize -> coordinate -> guard"
requires-python = ">=3.10"
dependencies = ["sympy>=1.12", "mpmath>=1.3", "numpy>=1.26", "scipy>=1.11", "networkx>=3.2", "z3-solver>=4.12", "pint>=0.23"]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
mathcore = "mathcore.cli:main"
mathcore-mcp = "mathcore.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
