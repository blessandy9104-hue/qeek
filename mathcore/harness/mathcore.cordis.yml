# Opt-in overlay: give the DeepSeek harness the verified-math tools over MCP.
# Install first (the harness starts the server but never runs a package manager):
#   pip install -e /path/to/mathcore        # provides the `mathcore-mcp` command
# Then:  dsh web --patch "$PWD/harness/mathcore.cordis.yml"
#
# Needs no API key and no network. Modeled on apps/cli/config/examples/mcp-memory/*.cordis.yml.
# UNTESTED against a running harness (no model key was available when this was written);
# the server itself is covered by tests/test_adversarial.py::test_mcp_server_speaks_the_protocol.
- insert:
    - id: mathcore-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mathcore
        transport: stdio
        command: mathcore-mcp
        cwd: !!js process.cwd()
        env:
          MATHCORE_AUDIT: !!js >-
            process.env.MATHCORE_AUDIT?.trim() || process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.mathcore', 'audit.jsonl')
